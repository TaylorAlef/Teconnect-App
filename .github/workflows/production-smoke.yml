name: Te-connect Production Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'index.html'
      - 'public/**'
      - 'src/**'
      - 'supabase/**'
      - 'package.json'
      - 'vite.config.js'
      - 'wrangler.jsonc'
      - 'playwright.config.ts'
      - 'tests/e2e/**'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production homepage
        shell: bash
        run: |
          set -euo pipefail
          url="https://app.te-connect.com/"
          tmp="$(mktemp)"
          status="$(curl -L --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 -o "$tmp" -w '%{http_code}' "$url")"
          echo "Production HTTP status: $status"
          test "$status" -ge 200
          test "$status" -lt 400
          grep -qi "Te-connect" "$tmp"
          grep -qi "People OS" "$tmp"
          echo "Production homepage smoke check passed."

      - name: Check manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(curl -L --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 https://app.te-connect.com/manifest.webmanifest)"
          printf '%s' "$manifest" | grep -q 'Te-connect'
          printf '%s' "$manifest" | grep -q 'People OS'
          echo "Production manifest smoke check passed."

      - name: Check launch infrastructure endpoints
        shell: bash
        run: |
          set -euo pipefail
          for asset in /robots.txt /sitemap.xml /og-image.svg /privacy.html /terms.html /404.html; do
            status="$(curl -L --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "https://app.te-connect.com${asset}")"
            echo "$asset -> $status"
            test "$status" -ge 200
            test "$status" -lt 400
          done
          echo "Production launch infrastructure smoke check passed."
      - name: Check HD dashboard hero asset
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -L --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "https://app.te-connect.com/assets/teconnect-dashboard-hero.webp")"
          echo "/assets/teconnect-dashboard-hero.webp -> $status"
          test "$status" -ge 200
          test "$status" -lt 400
          echo "HD dashboard hero asset smoke check passed."

      - name: Check public branding assets
        shell: bash
        run: |
          set -euo pipefail
          for asset in /teconnect-logo.svg /teconnect-brand-logo.css /global-locale-runtime.js /sw.js; do
            status="$(curl -L --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "https://app.te-connect.com${asset}")"
            echo "$asset -> $status"
            test "$status" -ge 200
            test "$status" -lt 400
          done
          echo "Production static asset smoke check passed."


  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke — public refresh
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://app.te-connect.com
        run: npx playwright test tests/e2e/production-refresh.spec.ts
