name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

env:
  VITE_SUPABASE_URL: https://kegmysndcrytlsuclhsq.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TECONNECT_SUPABASE_PUBLISHABLE_KEY }}
  VITE_ENABLE_DEMO: 'false'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Supabase build configuration
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL is missing"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::GitHub Actions secret TECONNECT_SUPABASE_PUBLISHABLE_KEY is missing"; exit 1; }

      - name: Validate mobile contract
        run: npm run mobile:check

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Prepare Android location permissions
        run: npm run mobile:prepare:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload collaborator APK
        uses: actions/upload-artifact@v4
        with:
          name: te-connect-collaborador-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
