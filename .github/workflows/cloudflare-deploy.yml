name: Te-connect Cloudflare Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: teconnect-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deployed: ${{ steps.result.outputs.deployed }}
    steps:
      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Cloudflare secrets are not configured; deployment is skipped safely."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v4
      - name: Setup Node
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: npm ci
      - name: Build production
        if: steps.credentials.outputs.configured == 'true'
        run: npm run build
      - name: Deploy to Cloudflare
        if: steps.credentials.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Record deployment result
        id: result
        shell: bash
        run: |
          if [ "${{ steps.credentials.outputs.configured }}" = "true" ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ needs.deploy.outputs.deployed == 'true' }}
    steps:
      - name: Verify Cloudflare production
        shell: bash
        run: |
          set -euo pipefail
          for path in "/" "/manifest.webmanifest" "/assets/teconnect-dashboard-hero.webp"; do
            status="$(curl -L --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "https://app.te-connect.com$path")"
            echo "$path -> $status"
            test "$status" -ge 200
            test "$status" -lt 400
          done
          echo "Cloudflare production verification passed."
