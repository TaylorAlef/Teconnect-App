name: Te-connect Production Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: teconnect-production-gate
  cancel-in-progress: true

jobs:
  validate:
    name: build-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production
        run: npm run build

      - name: Validate branding
        run: npm run check:branding

      - name: Validate globalization
        run: npm run check:globalization

      - name: Validate web launch
        run: npm run check:web-launch

      - name: Validate SaaS contract
        run: npm run check:saas-contract

      - name: Validate mobile readiness
        run: npm run mobile:check
