name: Te-connect Mobile Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/prepare-native-permissions.mjs'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web bundle
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Verify Android location permissions
        run: npm run mobile:prepare:android
      - name: Build Android debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: teconnect-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web bundle
        run: npm run build
      - name: Generate iOS project
        run: npx cap add ios
      - name: Sync Capacitor iOS
        run: npx cap sync ios
      - name: Prepare iOS location permissions
        run: npm run mobile:prepare:ios
      - name: Build iOS simulator target
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -sdk iphonesimulator
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
