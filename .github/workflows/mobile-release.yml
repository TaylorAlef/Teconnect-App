name: Te-connect Mobile Release\n\non:\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  android-release:\n    runs-on: ubuntu-latest\n    timeout-minutes: 25\n    env:\n      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/teconnect-release.keystore\n      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}\n      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}\n      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v7\n      - name: Setup Node\n        uses: actions/setup-node@v7\n        with:\n          node-version: 24\n      - name: Setup Java\n        uses: actions/setup-java@v6\n        with:\n          distribution: temurin\n          java-version: '21'\n      - name: Validate Android signing secrets\n        env:\n          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}\n        run: |\n          set -euo pipefail\n          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do\n            if [ -z "${!name:-}" ]; then\n              echo "Missing GitHub Actions secret: $name"\n              exit 1\n            fi\n          done\n      - name: Install dependencies\n        run: npm install --no-audit --no-fund\n      - name: Build web bundle\n        run: npm run build\n      - name: Generate Android project\n        run: npx cap add android\n      - name: Sync Capacitor Android\n        run: npx cap sync android\n      - name: Prepare Android permissions\n        run: npm run mobile:prepare:android\n      - name: Verify Android target API\n        shell: bash\n        run: |\n          set -euo pipefail\n          matches="$(grep -RhoE 'targetSdk(Version)?[[:space:]]*(=|:)?[[:space:]]*[0-9]+' android 2>/dev/null || true)"\n          target_sdk="$(printf '%s\n' "$matches" | grep -oE '[0-9]+$' | sort -nr | head -1 || true)"\n          if [ -z "$target_sdk" ] || [ "$target_sdk" -lt 36 ]; then\n            echo "Android release blocked: target SDK must be 36+."\n            exit 1\n          fi\n          echo "Detected Android target SDK: $target_sdk"\n      - name: Install release keystore\n        env:\n          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}\n        run: |\n          set -euo pipefail\n          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"\n          test -s "$ANDROID_KEYSTORE_PATH"\n          chmod 600 "$ANDROID_KEYSTORE_PATH"\n      - name: Configure Android release signing\n        shell: bash\n        run: |\n          set -euo pipefail\n          cat >> android/app/build.gradle <<'EOF'\n\n          android {\n            signingConfigs {\n              release {\n                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))\n                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')\n                keyAlias System.getenv('ANDROID_KEY_ALIAS')\n                keyPassword System.getenv('ANDROID_KEY_PASSWORD')\n              }\n            }\n            buildTypes {\n              release {\n                signingConfig signingConfigs.release\n              }\n            }\n          }\n          EOF\n      - name: Build signed Android AAB\n        working-directory: android\n        run: ./gradlew bundleRelease --no-daemon\n      - name: Upload signed Android AAB\n        uses: actions/upload-artifact@v4\n        with:\n          name: teconnect-android-release-aab\n          path: android/app/build/outputs/bundle/release/*.aab\n          if-no-files-found: error\n\n  ios-release:\n    runs-on: macos-latest\n    timeout-minutes: 35\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v7\n      - name: Setup Node\n        uses: actions/setup-node@v7\n        with:\n          node-version: 24\n      - name: Validate iOS signing secrets\n        env:\n          IOS_CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}\n          IOS_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}\n          IOS_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}\n          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}\n        run: |\n          set -euo pipefail\n          for value in IOS_CERT IOS_CERT_PASSWORD IOS_PROFILE IOS_TEAM_ID; do\n            if [ -z "${!value:-}" ]; then\n              echo "Missing required iOS release secret: $value"\n              exit 1\n            fi\n          done\n      - name: Install dependencies\n        run: npm install --no-audit --no-fund\n      - name: Build web bundle\n        run: npm run build\n      - name: Generate iOS project\n        run: npx cap add ios\n      - name: Sync Capacitor iOS\n        run: npx cap sync ios\n      - name: Prepare iOS permissions\n        run: npm run mobile:prepare:ios\n      - name: Import Apple distribution certificate\n        env:\n          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}\n          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}\n        run: |\n          set -euo pipefail\n          CERT_PATH="$RUNNER_TEMP/teconnect-distribution.p12"\n          KEYCHAIN_PATH="$RUNNER_TEMP/teconnect-build.keychain-db"\n          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"\n          printf '%s' "$CERT_B64" | base64 --decode > "$CERT_PATH"\n          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"\n          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"\n          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"\n          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"\n          security list-keychains -d user -s "$KEYCHAIN_PATH"\n          security default-keychain -s "$KEYCHAIN_PATH"\n          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"\n          security find-identity -v -p codesigning "$KEYCHAIN_PATH"\n      - name: Install provisioning profile\n        env:\n          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}\n        run: |\n          set -euo pipefail\n          PROFILE_PATH="$RUNNER_TEMP/teconnect.mobileprovision"\n          printf '%s' "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"\n          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"\n          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"\n          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"\n          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"\n          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"\n          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"\n          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"\n          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"\n      - name: Archive signed iOS app\n        env:\n          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}\n        run: |\n          set -euo pipefail\n          xcodebuild \\n            -project ios/App/App.xcodeproj \\n            -scheme App \\n            -sdk iphoneos \\n            -configuration Release \\n            -archivePath "$RUNNER_TEMP/Teconnect.xcarchive" \\n            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \\n            CODE_SIGN_STYLE=Manual \\n            CODE_SIGN_IDENTITY="Apple Distribution" \\n            PROVISIONING_PROFILE="$PROFILE_UUID" \\n            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \\n            PRODUCT_BUNDLE_IDENTIFIER="com.teconnect.app" \\n            archive\n      - name: Create App Store export options\n        env:\n          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}\n        run: |\n          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF\n          <?xml version="1.0" encoding="UTF-8"?>\n          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n          <plist version="1.0">\n          <dict>\n            <key>method</key>\n            <string>app-store</string>\n            <key>signingStyle</key>\n            <string>manual</string>\n            <key>teamID</key>\n            <string>$IOS_TEAM_ID</string>\n            <key>provisioningProfiles</key>\n            <dict>\n              <key>com.teconnect.app</key>\n              <string>$PROFILE_NAME</string>\n            </dict>\n          </dict>\n          </plist>\n          EOF\n      - name: Export signed iOS IPA\n        run: |\n          set -euo pipefail\n          mkdir -p "$RUNNER_TEMP/export"\n          xcodebuild \\n            -exportArchive \\n            -archivePath "$RUNNER_TEMP/Teconnect.xcarchive" \\n            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \\n            -exportPath "$RUNNER_TEMP/export"\n      - name: Upload signed iOS artifacts\n        uses: actions/upload-artifact@v4\n        with:\n          name: teconnect-ios-release\n          path: |\n            ${{ runner.temp }}/Teconnect.xcarchive/**\n            ${{ runner.temp }}/export/*.ipa\n          if-no-files-found: error